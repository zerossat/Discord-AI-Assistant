name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # Dummy values so Zod env-validation and the build don't fail in CI.
      DISCORD_TOKEN: ci-token
      DISCORD_CLIENT_ID: ci-client-id
      DISCORD_CLIENT_SECRET: ci-client-secret
      GEMINI_API_KEY: ci-gemini-key
      MONGODB_URI: mongodb://localhost:27017/discord-ai-ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-change-me
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
