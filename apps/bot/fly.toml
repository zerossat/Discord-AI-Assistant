# fly.toml cho Discord Bot & API Backend

app = "discord-ai-assistant-bot"
primary_region = "hkg"

[build]
  dockerfile = "apps/bot/Dockerfile"
  ignorefile = ".dockerignore"

[http_service]
  internal_port = 4000
  force_https = true
  # QUAN TRỌNG: Không tự động tắt máy khi không có traffic HTTP, 
  # nếu không bot Discord sẽ bị ngắt kết nối (offline).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
