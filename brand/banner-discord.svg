  <text x="322" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="2" fill="#9AA6D8">Trợ lý AI thông minh cho Discord · Gemini</text>

  <g fill="#5BD2FF">
