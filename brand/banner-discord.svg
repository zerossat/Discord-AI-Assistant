  <circle cx="190" cy="90" r="7" fill="#10B6FF"/>

  <rect x="118" y="168" width="144" height="144" rx="40" fill="url(#tile)"/>
  <path d="M190 198 l13 33 33 13 -33 13 -13 33 -13 -33 -33 -13 33 -13 z" fill="#FFFFFF"/>
  <path d="M232 196 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#EAF6FF" opacity="0.9"/>

