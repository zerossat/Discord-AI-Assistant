<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Assistant banner">
  <title>AI Assistant — Discord banner</title>
  <defs>
    <radialGradient id="bbg" cx="28%" cy="42%" r="90%">
      <stop offset="0%" stop-color="#1A2342"/>
      <stop offset="55%" stop-color="#0C1120"/>
      <stop offset="100%" stop-color="#06080F"/>
    </radialGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8CFF"/>
      <stop offset="50%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#10B6FF"/>
    </linearGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C2CCFF"/>
    </linearGradient>
    <radialGradient id="orbL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B6FF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#10B6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bbg)"/>
  <circle cx="210" cy="230" r="300" fill="url(#orbL)"/>
  <circle cx="1040" cy="300" r="320" fill="url(#orbR)"/>

  <g opacity="0.10" stroke="#9FB0FF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
  </g>

  <g opacity="0.6" fill="none" stroke="#3A4576" stroke-width="2">
