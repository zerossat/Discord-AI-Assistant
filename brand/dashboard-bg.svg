<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dashboard background">
  <title>AI Assistant — dashboard background</title>
  <defs>
    <radialGradient id="dbg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#141B33"/>
      <stop offset="55%" stop-color="#0A0E1C"/>
      <stop offset="100%" stop-color="#05070E"/>
    </radialGradient>
    <radialGradient id="o1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B6FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#10B6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="#9FB0FF" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#dbg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <circle cx="320" cy="240" r="520" fill="url(#o1)"/>
  <circle cx="1680" cy="900" r="560" fill="url(#o2)"/>
  <circle cx="1500" cy="180" r="360" fill="url(#o3)"/>

  <g opacity="0.5" fill="none" stroke="#2C3760" stroke-width="1.5">
    <ellipse cx="960" cy="540" rx="760" ry="300"/>
    <ellipse cx="960" cy="540" rx="520" ry="200"/>
  </g>

  <g fill="#5BD2FF" opacity="0.8">
    <circle cx="480" cy="700" r="3"/>
    <circle cx="700" cy="300" r="2.5"/>
    <circle cx="1240" cy="760" r="3"/>
    <circle cx="1420" cy="420" r="2.5"/>
    <circle cx="980" cy="220" r="2"/>
    <circle cx="1640" cy="560" r="2.5"/>
    <circle cx="300" cy="520" r="2"/>
  </g>

  <g opacity="0.7">
    <path d="M1560 880 l11 28 28 11 -28 11 -11 28 -11 -28 -28 -11 28 -11 z" fill="#3A4576"/>
    <path d="M360 880 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z" fill="#2C3760"/>
  </g>
</svg>
