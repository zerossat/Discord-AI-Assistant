<script>
const ASSETS=[
 {id:'s-avatar',title:'Avatar bot (vuông)',file:'logo-avatar',w:512,h:512},
 {id:'s-wordmark',title:'Logo wordmark (nền trong suốt)',file:'logo-wordmark',w:760,h:200},
 {id:'s-banner',title:'Banner Discord',file:'banner-discord',w:1200,h:480},
 {id:'s-bg',title:'Nền dashboard',file:'dashboard-bg',w:1920,h:1080},
 {id:'s-icons',title:'Bộ icon lệnh',file:'icons',w:1000,h:280}
];
function svgText(id){return document.getElementById(id).textContent.trim();}
const grid=document.getElementById('grid');
ASSETS.forEach(a=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<h2>'+a.title+'</h2><div class="prev">'+svgText(a.id)+'</div>'+
    '<div class="row"><button>Tải PNG</button><span class="dim">'+a.w+'×'+a.h+'px</span></div>';
  card.querySelector('button').onclick=()=>downloadOne(a);
  grid.appendChild(card);
});
function downloadOne(a){
  const raw=svgText(a.id).replace('<svg ','<svg width="'+a.w+'" height="'+a.h+'" ');
  const img=new Image();
  img.onload=function(){
    const c=document.createElement('canvas');c.width=a.w;c.height=a.h;
    c.getContext('2d').drawImage(img,0,0,a.w,a.h);
    c.toBlob(function(b){const l=document.createElement('a');l.download=a.file+'.png';l.href=URL.createObjectURL(b);l.click();},'image/png');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(raw);
}
function downloadAll(){ASSETS.forEach((a,i)=>setTimeout(()=>downloadOne(a),i*400));}
</script>
